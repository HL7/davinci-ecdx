resourceType: Requirements
id: cdex-data-source
url: http://hl7.org/fhir/us/davinci-cdex/Requirements/cdex-data-source
name: CDexDataSourceRequirements
title: CDex Data Source Requirements
description: This [Requirements](https://hl7.org/fhir/R5/requirements.html) resource lists all the CDex Data Source requirements defined in the narrative sections of this IG.
statement:
  - key: CONF-007
    reference:
      - direct-query.html#discovery-of-patient-fhir-ids
    conformance:
      - SHALL
    requirement: CDex Data Source servers **SHALL** support resolving logical identifiers for the Patient resource.
  - key: CONF-010
    reference:
      - direct-query.html#data-sourceresponder-requirements
    conformance:
      - SHALL
    requirement: If the Data Consumer attempts to fetch a resource with a read and a signature is required, the Data Source/Responder **SHALL** return an HTTP `400 Bad Request` *and* an OperationOutcome describing the business rule error.
    conditionality: true
  - key: CONF-011
    reference:
      - index.html#about-this-guide
    conformance:
      - SHALL
    requirement: The [Da Vinci](http://www.hl7.org/about/davinci/index.cfm?ref=common) initiative supports this implementation guide. Da Vinci is a private effort to accelerate the adoption of Health Level Seven International Fast Healthcare Interoperability Resources (HL7¬Æ FHIR¬Æ) as the standard to support and integrate value-based care (VBC) data exchange across communities. This guide and implementers of it **SHALL** adhere to the [HL7 Da Vinci Guiding Principles](https://confluence.hl7.org/display/DVP/Da+Vinci+Clinical+Advisory+Council+Members?preview=/66940155/66942916/Guiding%20Principles%20for%20Da%20Vinci%20Implementation%20Guides.pdf) for exchanging patient health information.
  - key: CONF-014
    reference:
      - security.html#da-vinci-hrex-security-and-privacy-requirements
    conformance:
      - SHALL
    requirement: |-
      Implementers **SHALL** read and adhere to the guidance for the following topics in the [HRex Security and Privacy](http://hl7.org/fhir/us/davinci-hrex/1.2.0/security.html):<sup>[§][CONF-014]</sup>

      - Da Vinci's Guiding Principles
      - Statutes, Regulations
      - Clinical Safety Guidelines
      - FHIR Security and Implementation Guidance
      - Security/Privacy-Related Technologies, Including Explicit Consent and Security - Labels
      - Exchange Security
      - Additionally Protected Information
      - Security Contexts for Da Vinci IGs
  - key: CONF-015
    reference:
      - security.html#general-considerations
    conformance:
      - SHALL
    requirement: User scopes **SHALL** be used as defined in [SMART App Launch](http://www.hl7.org/fhir/smart-app-launch/) to restrict access to the relevant patients for a given Data Consumer.
  - key: CONF-016
    reference:
      - security.html#general-considerations
    conformance:
      - SHALL
    requirement: Audit mechanisms **SHALL** be in place so that exchange mechanisms *with or without human intervention* can be subject to review/oversight.
  - key: CONF-018
    reference:
      - security.html#purpose-of-use
    conformance:
      - SHALL
    requirement: The Data Consumer and Data Source **SHALL** use it [codes from the CDex Purpose of Use Value Set in the POU Task.input element.] to communicate the POU for the requested data when trading partner agreements require the POU to be exchanged.
    conditionality: true
  - key: CONF-059
    reference:
      - task-based-approach.html#task-state-machine
    conformance:
      - SHALL
    requirement: The Data Source **SHALL** support *all* the statuses in the [HRex Task Status ValueSet](http://hl7.org/fhir/us/davinci-hrex/1.2.0/ValueSet-hrex-task-status.html).
  - key: CONF-064
    reference:
      - task-based-approach.html#subscription
    conformance:
      - SHALL
    requirement: Da Vinci CDex Data Sources who choose to support Subscription **SHALL** comply with the [Subscription R5 Backport Implementation Guide](http://hl7.org/fhir/uv/subscriptions-backport/STU1.1) and the Da Vinci Health Record Exchange (HRex) [Subscription requirements](https://build.fhir.org/ig/HL7/davinci-ehrx/task.html#subscription) for subscribing to Task updates.
    conditionality: true
  - key: CONF-065
    reference:
      - task-based-approach.html#hrex-task-subscription-topic
    conformance:
      - SHALL
    requirement: ' Da Vinci CDex Data Sources who choose to support Subscription ...**SHALL** support the HRex Task Subscription Topic….'
    conditionality: true
  - key: CONF-067
    reference:
      - task-based-approach.html#discovery
    conformance:
      - SHALL
    requirement: Da Vinci CDex Data Sources who choose to support Subscription  ...**SHALL** support discovery of the CDex Task Update Subscription Topic canonical URL.
    conditionality: true
  - key: CONF-080
    reference:
      - StructureDefinition-cdex-task-data-request.html
    conformance:
      - SHALL
    requirement: The `Task.reasonReference` `DocumentReference.author` is a  *Must Support*  element with four target profile and three Coverage profiles. Servers **SHALL** support at least one of them ….
  - key: CONF-081
    reference:
      - StructureDefinition-cdex-task-data-request.html
    conformance:
      - SHALL
    requirement: The `Task.reasonReference` `DocumentReference.author` is a  *Must Support*  element with four target profile and three Coverage profiles ... when supporting a Coverage profile, **SHALL** support the Coverage Profile based on the US Core version [they are supporting].
    conditionality: true
  - key: CONF-083
    reference:
      - ValueSet-cdex-POU.html
    conformance:
      - SHALL
    requirement: 'do not define the detailed POU, and the implementer **SHALL** supply an additional, alternate code. The resource fragment below shows their use:'
  - key: CONF-086
    reference:
      - attachments-conformance.html
    conformance:
      - SHALL
    requirement: '[Must Support](http://hl7.org/fhir/R4/profiling.html#mustsupport) elements are marked with the *mustSupport* flag and **SHALL** be interpreted [by the Task Source and Task Consumer] as follows in CONF-088, CONF-090, CONF-092, CONF-094, CONF-096.'
  - key: CONF-087
    reference:
      - task-based-conformance.html
    conformance:
      - SHALL
    requirement: '[Must Support](http://hl7.org/fhir/R4/profiling.html#mustsupport) elements are marked with the *mustSupport* flag and **SHALL** be interpreted [by the Task Source and Task Consumer] as follows in CONF-089, CONF-091, CONF-093, CONF-095, CONF-097.'
  - key: CONF-088
    reference:
      - attachments-conformance.html
    conformance:
      - SHALL
    requirement: |-
      [for [Must Support](http://hl7.org/fhir/R4/profiling.html#mustsupport) elements are marked with the *mustSupport* flag and ] the minimum cardinality of an element is greater than 0, the
        element is *required* and the Task Source **SHALL** populatie the data element with a value unless {CONF-091].
    conditionality: true
  - key: CONF-089
    reference:
      - task-based-conformance.html
    conformance:
      - SHALL
    requirement: |-
      [for [Must Support](http://hl7.org/fhir/R4/profiling.html#mustsupport) elements are marked with the *mustSupport* flag and ] the minimum cardinality of an element is greater than 0, the
        element is *required* and the Task Source **SHALL** populatie the data element with a value unless {CONF-091].
    conditionality: true
  - key: CONF-090
    reference:
      - attachments-conformance.html
    conformance:
      - SHALL
    requirement: |-
      [For [Must Support](http://hl7.org/fhir/R4/profiling.html#mustsupport) elements are marked with the *mustSupport* flag and ] the minimum cardinality of an element is greater than 0, the
        element is *required* unless the profile references a dataAbsentReason (DAR) extension, then the Task Source **SHALL** use that extension to communicate the reason for missing data.
  - key: CONF-091
    reference:
      - task-based-conformance.html
    conformance:
      - SHALL
    requirement: |-
      [For [Must Support](http://hl7.org/fhir/R4/profiling.html#mustsupport) elements are marked with the *mustSupport* flag and ] the minimum cardinality of an element is greater than 0, the
        element is *required* unless the profile references a dataAbsentReason (DAR) extension, then the Task Source **SHALL** use that extension to communicate the reason for missing data.
    conditionality: true
  - key: CONF-092
    reference:
      - attachments-conformance.html
    conformance:
      - SHALL
    requirement: '[For [Must Support](http://hl7.org/fhir/R4/profiling.html#mustsupport) elements marked with the *mustSupport* flag and ] the minimum cardinality of an element is equal to 0, the Task Source **SHALL** be capable of populating the data element when sharing Task compliant with a CDex profile.'
    conditionality: true
  - key: CONF-093
    reference:
      - task-based-conformance.html
    conformance:
      - SHALL
    requirement: '[For [Must Support](http://hl7.org/fhir/R4/profiling.html#mustsupport) elements marked with the *mustSupport* flag and ] the minimum cardinality of an element is equal to 0, the Task Source **SHALL** be capable of populating the data element when sharing Task compliant with a CDex profile.'
    conditionality: true
  - key: CONF-094
    reference:
      - attachments-conformance.html
    conformance:
      - SHALL
    requirement: |-
      [ For [Must Support](http://hl7.org/fhir/R4/profiling.html#mustsupport) elements are marked with the *mustSupport* flag , the] ... Task Consumer **SHALL** be capable of processing Task instances  containing the data elements without generating an error or causing
        the application to fail.
  - key: CONF-095
    reference:
      - task-based-conformance.html
    conformance:
      - SHALL
    requirement: |-
      [ For [Must Support](http://hl7.org/fhir/R4/profiling.html#mustsupport) elements are marked with the *mustSupport* flag , the] ... Task Consumer **SHALL** be capable of processing Task instances  containing the data elements without generating an error or causing
        the application to fail.
  - key: CONF-005
    reference:
      - background.html#where-does-cdex-fit-in-the-da-vinci-project
    requirement: The use of CDex **SHALL NOT** be considered compliant with any use case specific IG where CDex is not explicitly required as part of the supported exchanges.
    extension:
      - url: http://hl7.org/fhir/tools/StructureDefinition/requirements-statementshallnot
        valueBoolean: true
    conditionality: true
  - key: CONF-001
    reference:
      - attachments-conformance.html#introduction
    conformance:
      - SHOULD
    requirement: |-
      Systems ...**SHOULD** define what they support in their local capability statement in one or more of the following ways:

      1. (Preferred) Formally derived implementable profile from [CDex Task Attachment Request Profile](StructureDefinition-cdex-task-attachment-request.html)
      2. Document their systems' capabilities for requesting attachments in `CapabilityStatement.rest.resource.documentation` for the Task resource.
      3. (Preferred) Formal [OperationDefinition](http://hl7.org/fhir/R4/operationdefinition.html) derived from [`$submit-attachment`](OperationDefinition-submit-attachment.html)
      4. Document their systems' capabilities for submitting attachments in `CapabilityStatement.rest.documentation`
  - key: CONF-002
    reference:
      - attachments-conformance.html#submit-attachment-parameters-for-sending-attachments
    conformance:
      - SHOULD
    requirement: When submitting unsolicited attachments [using the $submit-attachment operation], the [Data Source/]Provider  **SHOULD** populate `Attachment.Code`[parameter].
    conditionality: true
  - key: CONF-006
    reference:
      - direct-query.html#discovery-of-patient-fhir-ids
    conformance:
      - SHOULD
    requirement: CDex Data Source servers **SHOULD** support the patient match operation and declare it in their CapabilityStatement.
  - key: CONF-008
    reference:
      - direct-query.html#provenance
    conformance:
      - SHOULD
    requirement: To the extent that the Data Source keeps a record of the provenance of the data, the FHIR Provenance Resource can be requested as documented on US Core's [Basic Provenance](http://hl7.org/fhir/us/core/STU7/basic-provenance.html) page. When returning provenance, they **SHOULD** use the [HRex Provenance Profile](http://hl7.org/fhir/us/davinci-hrex/1.2.0/StructureDefinition-hrex-provenance.html).
    conditionality: true
  - key: CONF-056
    reference:
      - solicited-unsolicited-attachments.html
    conformance:
      - SHOULD
    requirement: ' Although the PAS guide leverages CDex, implementers **SHOULD** follow the Burden Reduction IGs to request additional information for prior authorization.'
  - key: CONF-068
    reference:
      - task-based-approach.html#discovery
    conformance:
      - SHOULD
    requirement: Da Vinci CDex Data Sources who choose to support Subscription  ... **SHOULD** support discovery using the CapabilityStatement SubscriptionTopic Canonical extension and
    conditionality: true
  - key: CONF-078
    reference:
      - task-based-conformance.html#introduction
    conformance:
      - SHOULD
    requirement: |-
      Systems **SHOULD** define what they support in their local capability statement in one or more of the following ways:

      1. (Preferred) Formally derived implementable profile from [CDex Task Data Request Profile]
      (StructureDefinition-cdex-task-data-request.html)
      1. Document their systems' capabilities for requesting attachments in `CapabilityStatement.rest.resource.documentation` for the Task resource.
      2. (Preferred) Formal [OperationDefinition](http://hl7.org/fhir/R4/operationdefinition.html) derived from [`$submit-attachment`](OperationDefinition-submit-attachment.html)
      3. Document their systems' capabilities for submitting attachments in `CapabilityStatement.rest.documentation`
  - key: CONF-084
    reference:
      - sending-attachments.html#provider-requirements
    conformance:
      - SHOULD
    requirement: if multiple documents need to be signed, systems **SHOULD** minimize the number of interactions required by the user
    conditionality: true
  - key: CONF-085
    reference:
      - task-based-approach.html#data-source-requirements
    conformance:
      - SHOULD
    requirement: if multiple documents need to be signed, systems **SHOULD** minimize the number of interactions required by the user
    conditionality: true
  - key: CONF-004
    reference:
      - background.html#where-does-cdex-fit-in-the-da-vinci-project
    conformance:
      - SHOULD-NOT
    requirement: CDex is not intended to supersede other Da Vinci guides, which focus on a particular use case and define how to share clinical information. However, CDex may be used to request clinical data from a provider when an alternative is needed to cover some aspects of an exchange. For example, suppose the provider's data release process does not allow the automatic request for information specified in a use case specific IG. In that case, CDex provides an asynchronous process that allows manual review before releasing the information. However, implementers **SHOULD NOT** use this transaction when there is a requirement for real-time response to facilitate patient care.
    conditionality: true
  - key: CONF-096
    reference:
      - attachments-conformance.html
    conformance:
      - SHOULD-NOT
    requirement: '[Data Consumers] ...**SHOULD NOT** reject instances that contain unexpected data elements if those elements are not [modifier elements](http://hl7.org/fhir/R4/conformance-rules.html#isModifier).'
    conditionality: true
  - key: CONF-097
    reference:
      - task-based-conformance.html
    conformance:
      - SHOULD-NOT
    requirement: '[Data Consumers] ...**SHOULD NOT** reject instances that contain unexpected data elements if those elements are not [modifier elements](http://hl7.org/fhir/R4/conformance-rules.html#isModifier).'
    conditionality: true
  - key: CONF-017
    reference:
      - security.html#purpose-of-use
    conformance:
      - MAY
    requirement: 'Data Consumer and Data Source **MAY** communicate the POU for the requested data for each Task using codes from the [CDex Purpose of Use Value Set](ValueSet-cdex-POU.html) in the POU `Task.input` element. '
    conditionality: true
  - key: CONF-060
    reference:
      - task-based-approach.html#task-state-machine
    conformance:
      - MAY
    requirement: The Data Source **MAY** support additional transitions [than shwn in the CDex State Diagram], including transitions from terminal states (e.g., back to "in-progress" from "failed" or "completed").
  - key: CONF-061
    reference:
      - task-based-approach.html#task-state-machine
    conformance:
      - MAY
    requirement: The Data Source **MAY** use [`Task.businessStatus`](http://hl7.org/fhir/R4/task-definitions.html#Task.businessStatus) to track intermediate business statuses for their specific implementation.
  - key: CONF-066
    reference:
      - task-based-approach.html#hrex-task-subscription-topic
    conformance:
      - MAY
    requirement: Da Vinci CDex Data Sources who choose to support Subscription  ... **MAY** support other subscription topics [in addtion to  the HRex Task Subscription Topic].
    conditionality: true
  - key: CONF-069
    reference:
      - task-based-approach.html#discovery
    conformance:
      - MAY
    requirement: Da Vinci CDex Data Sources who choose to support Subscription  … **MAY** support discovery by some other method.
    conditionality: true
  - key: CONF-019
    reference:
      - security.html#general-considerations
    conformance:
      - SHALL
    requirement: Organizational user access scopes are typically pre-negotiated and documented via business agreements. Data Sources **SHALL** translate these agreements into the appropriate SMART App Launch scopes.

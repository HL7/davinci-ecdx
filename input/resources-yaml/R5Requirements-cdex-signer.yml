resourceType: Requirements
id: cdex-signer
url: http://hl7.org/fhir/us/davinci-cdex/Requirements/cdex-signer
name: CDexSignerRequirements
title: CDex Signer Requirements
description: This [Requirements](https://hl7.org/fhir/R5/requirements.html) resource lists all the CDex Signer requirements defined in the narrative sections of this IG.
statement:
  - key: CONF-026
    reference:
      - signatures.html#cdex-signatures
    conformance:
      - SHALL
    requirement: 'Both [CDex Task Attachment Request Profile](StructureDefinition-cdex-task-attachment-request.html) and the [DTR Standard Questionnaire](http://hl7.org/fhir/us/davinci-dtr/2.2.0/StructureDefinition-dtr-std-questionnaire.html) profile have the overlapping capability to indicate that a signature is required. Signers **SHALL** meet both the Task *and* Questionnaire signature expectations. '
    conditionality: true
  - key: CONF-027
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '**SHALL** use the [CDex Digital Signature Profile](StructureDefinition-cdex-digital-signature.html) with the [CDex Signature Bundle Profile](StructureDefinition-cdex-signature-bundle.html) for digitally signed Bundles and with the [CDex SDC QuestionnaireResponse Profile](StructureDefinition-cdex-sdc-questionnaireresponse.html) for digitally signed QuestionnaireResponse.'
  - key: CONF-028
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[Implementers **SHALL** follow the following FHIR R6 [JSON Signature rules](https://hl7.org/fhir/6.0.0-ballot3/datatypes.html#JSON)]: The Signature.data is base64 encoded JWS-Signature [RFC 7515]: JSON Web Signature (JWS)'
  - key: CONF-029
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[Implementers **SHALL** follow the following FHIR R6 [JSON Signature rules](https://hl7.org/fhir/6.0.0-ballot3/datatypes.html#JSON)]: The JWS mime type `application/jose` **SHALL** be indicated in the `Signature.sigFormat` element.'
  - key: CONF-030
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[Implementers **SHALL** follow the following FHIR R6 [JSON Signature rules](https://hl7.org/fhir/6.0.0-ballot3/datatypes.html#JSON)]:...**SHALL** use the IETF JSON Canonicalization Scheme (JCS) (see [RFC 8785](https://datatracker.ietf.org/doc/rfc8785)) to generate the canonical form of the resource.'
  - key: CONF-031
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[Implementers **SHALL** follow the following FHIR R6 [JSON Signature rules](https://hl7.org/fhir/6.0.0-ballot3/datatypes.html#JSON)]:... the URI `application/fhir+json;canonicalization=http://hl7.org/fhir/canonicalization/json#document` ... **SHALL** be indicated in the `Signature.targetFormat` element.'
  - key: CONF-034
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[Implementers **SHALL** follow the following FHIR R6 [JSON Signature rules](https://hl7.org/fhir/6.0.0-ballot3/datatypes.html#JSON)]: `Bundle.id`, and `Bundle.meta`  **SHALL** be removed before canonicalization. In other words, everything in a Bundle is signed *except* for these elements.'
  - key: CONF-035
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[Implementers **SHALL** follow the following FHIR R6 [JSON Signature rules](https://hl7.org/fhir/6.0.0-ballot3/datatypes.html#JSON)]: For signatures representing the entire QuestionnaireResponse, `QuestionnaireResponse.id`, and `QuestionnaireResponse.meta` elements **SHALL** be removed before canonicalization. In other words, everything in a QuestionnaireResponse is signed *except* for these elements.'
  - key: CONF-036
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[Implementers **SHALL** follow the following FHIR R6 [JSON Signature rules](https://hl7.org/fhir/6.0.0-ballot3/datatypes.html#JSON)]: For signatures representing an item in the QuestionnaireResponse, the `QuestionnaireResponse.item.id` **SHALL** be removed before canonicalization. In other words, everything in the `QuestionnaireResponse.item` is signed *except* for these elements.'
  - key: CONF-037
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[Implementers **SHALL** follow the following FHIR R6 [JSON Signature rules](https://hl7.org/fhir/6.0.0-ballot3/datatypes.html#JSON)]: The signature **SHALL** include a `"srCms"` signer commitments" header element for the Purpose(s) of the Signature (see [JAdES-B-T](https://www.etsi.org/deliver/etsi_ts/119100_119199/11918201/01.01.01_60/ts_11918201v010101p.pdf), page 17). The Purpose can be the action being attested to, or the role associated with the signature. The value shall come from ASTM E1762-95(2013).'
  - key: CONF-038
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[Implementers **SHALL** follow the following FHIR R6 [JSON Signature rules](https://hl7.org/fhir/6.0.0-ballot3/datatypes.html#JSON)]: The `"srCms"` header **SHALL** contain an `"id": "urn:oid:1.2.840.10065.1.12.1.5"` (Verification Signature)'
  - key: CONF-039
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[Implementers **SHALL** follow the following FHIR R6 [JSON Signature rules](https://hl7.org/fhir/6.0.0-ballot3/datatypes.html#JSON)]: The `Signature.type.code` elements **SHALL** contain the same values as the `"srCms"` header ids.'
  - key: CONF-040
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[The signature header] **SHALL** include an `"alg"` parameter for the JSON Web Algorithms (JWA) (see [RFC 7518](https://tools.ietf.org/html/rfc7518)). `"alg": "RS256"` is preferred.'
  - key: CONF-042
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[The signature header] **SHALL** have `"x5c"` (X.509 certificate chain) equal to an array of one or more base64-encoded (not base64url-encoded) DER representations of the public certificate or certificate chain (see [RFC 7517](https://tools.ietf.org/html/rfc7517)).'
  - key: CONF-043
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[The signature header] **SHALL** include a `"sigT"` header parameter with a timestamp of the signature.'
  - key: CONF-044
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[The signature header] **SHALL** include a `"srCms"` signer commitments as defined above.[ commitments header element for the Purpose(s) of the Signature]'
  - key: CONF-046
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[The signature] **SHALL** support JWS compact serialization format for single signatures'
  - key: CONF-048
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: The [signature] certificate **SHALL** include a Subject Alternative Name (SAN)
  - key: CONF-049
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[The] Subject Alternative Name (SAN) ... **SHALL** match the `Signature.who.identifier`[element].'
  - key: CONF-045
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHOULD
    requirement: '[The signature] **SHOULD** use the hashing algorithm SHA256. The signature validation policy will apply to the signature and determine the acceptability'
  - key: CONF-047
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHOULD
    requirement: '[The signature] **SHOULD** support [JWS JSON Serialization](https://datatracker.ietf.org/doc/html/rfc7515#section-3.2) format to represent multiple signatures with identical parameter values except `"x5c"`.'
  - key: CONF-032
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - MAY
    requirement: |-
      Implementers that support both XML and JSON wire formats **MAY** support cross format signatures by:
      - Validating the JSON Web Signatures in the JSON format.
      - Canonicalizing the XHTML`text.div` narrative element following the [FHIR R6 XML Canonicalization rules](https://hl7.org/fhir/6.0.0-ballot3/xml.html#canonical) prior to the JSON canonicalization of the resource.
      - identifying this canonicalization method by the URI `application/fhir+json;canonicalization=http://hl7.org/fhir/canonicalization/json+xml#document` in the `Signature.targetFormat` element.
  - key: CONF-070
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[Implementers **SHALL** follow the following FHIR R6 [JSON Signature rules](https://hl7.org/fhir/6.0.0-ballot3/datatypes.html#JSON)]: The signature is a [Detached] Signature (where the content that is signed is removed from the JWS)'
  - key: CONF-071
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[Implementers **SHALL** follow the following FHIR R6 [JSON Signature rules](https://hl7.org/fhir/6.0.0-ballot3/datatypes.html#JSON)]: The `Bundle.signature` or the QuestionnaireResponse [signatureRequired] extension is removed before signing.'
  - key: CONF-072
    reference:
      - signatures.html#digital-signature-rules-and-guidance-for-cdex-bundle-and-questionnaireresponse
    conformance:
      - SHALL
    requirement: '[Implementers **SHALL** follow the following FHIR R6 [JSON Signature rules](https://hl7.org/fhir/6.0.0-ballot3/datatypes.html#JSON)]: When FHIR Resources are signed, the signature is across the [Canonical JSON](https://hl7.org/fhir/6.0.0-ballot3/json.html#canonical) form of the resource(s)'
